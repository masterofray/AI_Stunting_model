[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name          = "mamberamo-stunting-analysis"
version       = "0.0.5"
description   = "Comprehensive statistical analysis of child stunting in Mamberamo Raya Regency, Papua, Indonesia"
readme        = "README.md"
license       = {text = "MIT"}
authors       = [{name = "aryanto", email = "aryanto.dandan@gmail.com"}]
maintainers   = [{name = "aryanto", email = "aryanto.dandan@gmail.com"}]
classifiers   = ["Development Status :: 5 - Production/Stable",
                 "Intended Audience :: Science/Research",
                 "Intended Audience :: Healthcare Industry",
                 "License :: OSI Approved :: MIT License",
                 "Programming Language :: Python :: 3",
                 "Programming Language :: Python :: 3.9",
                 "Programming Language :: Python :: 3.10",
                 "Programming Language :: Python :: 3.11",
                 "Programming Language :: Python :: 3.12",
                 "Topic :: Scientific/Engineering :: Medical Science Apps",
                 "Topic :: Scientific/Engineering :: Information Analysis",
                 "Operating System :: OS Independent",]

requires-python = ">=3.9"
dependencies    = ["numpy>=1.21.0",
                   "pandas>=1.3.0",
                   "scipy>=1.7.0",
                   "statsmodels>=0.13.0",
                   "scikit-learn>=1.0.0",
                   "matplotlib>=3.4.0",
                   "seaborn>=0.11.0",]

[project.optional-dependencies]
dev             = ["pytest>=7.0.0",
                   "pytest-cov>=4.0.0",
                   "black>=23.0.0",
                   "flake8>=6.0.0",
                   "mypy>=1.0.0",]

[project.scripts]
stunting-analysis = "AI_Stunting_model:main"

[project.urls]
Homepage          = "https://github.com/masterofray/AI_Stunting_model"
Documentation     = "https://github.com/masterofray/AI_Stunting_model#readme"
Repository        = "https://github.com/masterofray/AI_Stunting_model"
Issues            = "https://github.com/masterofray/AI_Stunting_model/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where           = ["."]
include         = ["*.jpg", "*.json", "*sh",
                    "*.png", "*.csv", "*.md",]

[tool.black]
line-length     = 88
target-version  = ['py39', 'py310', 'py311', 'py312']

[tool.pytest.ini_options]
python_files    = "test_*.py"
testpaths       = ["tests"]