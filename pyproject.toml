[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mamberamo-stunting-analysis"
version = "0.1.0"
description = "Modular statistical and explainable XGBoost analysis of child stunting in Mamberamo Raya"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "aryanto", email = "aryanto.dandan@gmail.com"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.4",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "xgboost>=2.0",
    "optuna>=3.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
research = [
    "shap>=0.44",
]
lime = [
    "lime>=0.2.0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "flake8>=7.0",
    "mypy>=1.8",
    "build>=1.2",
]

[project.scripts]
stunting-research = "research.cli:main"

[project.urls]
Homepage = "https://github.com/masterofray/AI_Stunting_model"
Documentation = "https://github.com/masterofray/AI_Stunting_model#readme"
Repository = "https://github.com/masterofray/AI_Stunting_model"
Issues = "https://github.com/masterofray/AI_Stunting_model/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["research*", "xai*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]
