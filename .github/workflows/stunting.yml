name: Stunting Research CI

on:
  push:
    branches: ["master", "dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test modular research pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -e ".[research,dev]"

      - name: Run tests
        run: pytest -q

  research:
    name: Run end-to-end stunting research
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv pip install --system -e ".[research,lime]"

      - name: Run all-around research
        run: |
          python tests/all_around_reasearch.py \
            --source scr/query/RawData.sql \
            --output artefact \
            --trials 40 \
            --test-size 0.20 \
            --seed 42 \
            --xai-samples 5

      - name: Verify artifacts
        run: |
          test -f artefact/stunting_research_artifacts.zip
          test -f artefact/json/all_around_reasearch_summary.json
          test -f artefact/json/xgboost_optuna_best.json
          test -f artefact/xai/xai_summary.json
          test -f artefact/graphics/xgboost_tuned_confusion_matrix.png

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stunting-research-artifacts
          path: artefact/stunting_research_artifacts.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload expanded artifact directory
        uses: actions/upload-artifact@v4
        with:
          name: stunting-research-expanded
          path: artefact/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build Python package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build setuptools wheel

      - name: Build package
        run: python -m build

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
